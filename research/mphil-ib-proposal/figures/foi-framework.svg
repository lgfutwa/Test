<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1280" viewBox="0 0 980 1280" role="img" aria-labelledby="title desc">
  <title id="title">Figure 2.1. The FinTech-Orchestrated Internationalisation (FOI) Framework</title>
  <desc id="desc">Organisational orchestration readiness encloses the FinTech resource portfolio and FTRO core. FTRO forms a FinTech operating capability that activates four cross-border capabilities under institutional enablement, producing internationalisation outcomes that feed back into structuring via P7.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#253b5b"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-feedback" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b3a3a"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .enclosure { fill: #f8fafc; stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 9 6; }
      .box { fill: #ffffff; stroke: #253b5b; stroke-width: 2; }
      .core { fill: #e8eef6; stroke: #253b5b; stroke-width: 2.4; }
      .process { fill: #ffffff; stroke: #253b5b; stroke-width: 1.8; }
      .ftoc { fill: #eef2f7; stroke: #253b5b; stroke-width: 2.4; }
      .capability { fill: #edf5ef; stroke: #2f5d45; stroke-width: 2; }
      .outcome { fill: #f7f0e8; stroke: #8a5a2b; stroke-width: 2; }
      .title { font: 700 16px Georgia, 'Times New Roman', serif; fill: #172233; }
      .subtitle { font: italic 12px Georgia, 'Times New Roman', serif; fill: #475569; }
      .item { font: 13px Georgia, 'Times New Roman', serif; fill: #263548; }
      .small { font: 12px Georgia, 'Times New Roman', serif; fill: #475569; }
      .prop { font: 700 12px Georgia, 'Times New Roman', serif; fill: #253b5b; }
      .prop-feedback { font: 700 12px Georgia, 'Times New Roman', serif; fill: #8b3a3a; }
      .arrow { fill: none; stroke: #253b5b; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-dashed { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrow-muted); }
      .arrow-feedback { fill: none; stroke: #8b3a3a; stroke-width: 2; stroke-dasharray: 8 5; marker-end: url(#arrow-feedback); }
      .fig-label { font: 700 15px Georgia, 'Times New Roman', serif; fill: #172233; }
      .legend { font: 11px Georgia, 'Times New Roman', serif; fill: #475569; }
    </style>
  </defs>

  <rect class="canvas" width="980" height="1280"/>
  <text class="fig-label" x="490" y="28" text-anchor="middle">Figure 2.1. The FinTech-Orchestrated Internationalisation (FOI) Framework</text>

  <!-- Top enclosure: Organisational orchestration readiness (P5) -->
  <rect class="enclosure" x="60" y="48" width="720" height="430" rx="4"/>
  <text class="title" x="420" y="74" text-anchor="middle">ORGANISATIONAL ORCHESTRATION READINESS</text>
  <text class="prop" x="420" y="94" text-anchor="middle">P5 · conditions the whole conversion of portfolio into operating capability</text>
  <text class="small" x="420" y="114" text-anchor="middle">absorptive capacity · digital capability · leadership commitment · financial slack</text>

  <!-- FinTech resource portfolio -->
  <rect class="box" x="140" y="132" width="560" height="88" rx="3"/>
  <text class="title" x="420" y="158" text-anchor="middle">FINTECH RESOURCE PORTFOLIO</text>
  <text class="item" x="420" y="180" text-anchor="middle">by function: settlement · financing · compliance · trust / data</text>
  <text class="item" x="420" y="200" text-anchor="middle">by type: assets (held) · infrastructure (connected to) · services (contracted for) · intelligence (derived)</text>

  <!-- P1 arrow -->
  <line class="arrow" x1="420" y1="220" x2="420" y2="255"/>
  <text class="prop" x="560" y="245" text-anchor="middle">P1 · necessary, insufficient</text>

  <!-- FTRO orchestration core -->
  <rect class="core" x="110" y="260" width="620" height="198" rx="3"/>
  <text class="title" x="420" y="286" text-anchor="middle">FTRO · THE ORCHESTRATION CORE</text>
  <text class="subtitle" x="420" y="306" text-anchor="middle">managerial micro-processes · orchestration without ownership</text>

  <rect class="process" x="140" y="324" width="160" height="78" rx="2"/>
  <text class="title" x="220" y="352" text-anchor="middle" style="font-size:13px">STRUCTURING</text>
  <text class="small" x="220" y="372" text-anchor="middle">acquire · accumulate</text>
  <text class="small" x="220" y="388" text-anchor="middle">· divest</text>

  <rect class="process" x="345" y="324" width="160" height="78" rx="2"/>
  <text class="title" x="425" y="352" text-anchor="middle" style="font-size:13px">BUNDLING</text>
  <text class="small" x="425" y="372" text-anchor="middle">integrate · stabilise</text>
  <text class="small" x="425" y="388" text-anchor="middle">· enrich</text>

  <rect class="process" x="550" y="324" width="160" height="78" rx="2"/>
  <text class="title" x="630" y="352" text-anchor="middle" style="font-size:13px">LEVERAGING</text>
  <text class="small" x="630" y="372" text-anchor="middle">mobilise · coordinate</text>
  <text class="small" x="630" y="388" text-anchor="middle">· deploy</text>

  <line class="arrow" x1="300" y1="363" x2="345" y2="363"/>
  <line class="arrow" x1="505" y1="363" x2="550" y2="363"/>

  <!-- Internal reconfiguration loop -->
  <path class="arrow-dashed" d="M630,402 C630,430 220,430 220,402"/>
  <text class="small" x="420" y="444" text-anchor="middle">reconfiguration within an entry episode</text>

  <!-- P2 formation -->
  <line class="arrow" x1="420" y1="478" x2="420" y2="520"/>
  <text class="prop" x="500" y="505" text-anchor="start">P2 · formation</text>

  <!-- FinTech operating capability (FTOC) -->
  <rect class="ftoc" x="160" y="525" width="520" height="90" rx="3"/>
  <text class="title" x="420" y="555" text-anchor="middle">FINTECH OPERATING CAPABILITY (FTOC)</text>
  <text class="item" x="420" y="578" text-anchor="middle">the firm's working cross-border financial machinery</text>
  <text class="subtitle" x="420" y="598" text-anchor="middle">immediate product of FTRO — logically prior to the organisational capabilities it activates</text>

  <!-- P3 activation -->
  <line class="arrow" x1="420" y1="615" x2="420" y2="655"/>
  <text class="prop" x="500" y="640" text-anchor="start">P3 · activation</text>

  <!-- Bottom enclosure: Institutional enablement (P6) -->
  <rect class="enclosure" x="60" y="660" width="720" height="360" rx="4"/>
  <text class="title" x="420" y="686" text-anchor="middle">INSTITUTIONAL ENABLEMENT</text>
  <text class="prop" x="420" y="706" text-anchor="middle">P6 · conditions the whole conversion of activated capability into outcomes</text>
  <text class="small" x="420" y="726" text-anchor="middle">regulatory coherence · payment interoperability · infrastructure reliability · cybersecurity integrity</text>

  <!-- Four cross-border capabilities -->
  <rect class="capability" x="120" y="748" width="600" height="110" rx="3"/>
  <text class="title" x="420" y="776" text-anchor="middle">FOUR CROSS-BORDER CAPABILITIES</text>
  <text class="item" x="420" y="800" text-anchor="middle">cross-border financial-operational · international regulatory-adaptation</text>
  <text class="item" x="420" y="820" text-anchor="middle">international network-mobilisation · international opportunity-enactment</text>
  <text class="subtitle" x="420" y="842" text-anchor="middle">derived from the necessary elements of INVs (Oviatt &amp; McDougall, 1994)</text>

  <!-- P4 -->
  <line class="arrow" x1="420" y1="858" x2="420" y2="895"/>
  <text class="prop" x="520" y="874" text-anchor="middle">P4 · via reduced liability</text>
  <text class="prop" x="520" y="890" text-anchor="middle">of foreignness (Zaheer, 1995)</text>

  <!-- Outcomes -->
  <rect class="outcome" x="120" y="900" width="600" height="100" rx="3"/>
  <text class="title" x="420" y="930" text-anchor="middle">INTERNATIONALISATION OUTCOMES</text>
  <text class="item" x="420" y="954" text-anchor="middle">entry speed · international scope · international intensity · post-entry persistence</text>
  <text class="subtitle" x="420" y="976" text-anchor="middle">endpoints of a given entry episode — not of the process</text>

  <!-- P7 feedback path: from outcomes back to structuring -->
  <path class="arrow-feedback" d="M720,950 C875,950 920,330 220,402"/>
  <text class="prop-feedback" x="905" y="560" text-anchor="middle">P7</text>
  <text class="prop-feedback" x="905" y="580" text-anchor="middle">learning ·</text>
  <text class="prop-feedback" x="905" y="598" text-anchor="middle">resource</text>
  <text class="prop-feedback" x="905" y="616" text-anchor="middle">reconfiguration ·</text>
  <text class="prop-feedback" x="905" y="634" text-anchor="middle">revised</text>
  <text class="prop-feedback" x="905" y="652" text-anchor="middle">orchestration</text>
  <text class="small" x="905" y="678" text-anchor="middle">outcome experience</text>
  <text class="small" x="905" y="694" text-anchor="middle">re-enters structuring</text>

  <!-- Footer legend -->
  <text class="legend" x="60" y="1060">Grounded in INV theory; Resource Orchestration Theory specifies the mechanism (FTRO).</text>
  <text class="legend" x="60" y="1078">Contingencies drawn as enclosures, not single-link moderators. P1–P7 = theoretical propositions.</text>
  <text class="legend" x="60" y="1096">Source: Author's own. Aligned to Proposal Final v3.5.</text>

  <!-- Colour key -->
  <rect class="enclosure" x="60" y="1120" width="18" height="14"/>
  <text class="legend" x="86" y="1132">Contingency enclosure</text>
  <rect class="core" x="250" y="1120" width="18" height="14"/>
  <text class="legend" x="276" y="1132">FTRO core</text>
  <rect class="ftoc" x="370" y="1120" width="18" height="14"/>
  <text class="legend" x="396" y="1132">FTOC</text>
  <rect class="capability" x="460" y="1120" width="18" height="14"/>
  <text class="legend" x="486" y="1132">Capabilities</text>
  <rect class="outcome" x="600" y="1120" width="18" height="14"/>
  <text class="legend" x="626" y="1132">Outcomes</text>
  <line class="arrow-feedback" x1="720" y1="1127" x2="780" y2="1127"/>
  <text class="legend" x="790" y="1132">P7 feedback</text>
</svg>
